name: Continuous Integration
on:
  push:
    paths:
      - "**.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "**.json"
  pull_request:
    paths:
      - "**.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "**.json"

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        lint: [check, test, clippy, fmt]
        exclude: # https://github.com/community/community/discussions/7835
          - os: windows-latest
            lint: clippy
          - os: windows-latest
            lint: fmt
          - os: macOS-latest
            lint: clippy
          - os: macOS-latest
            lint: fmt
        include:
          - lint: check
            args: " --all-features"
          - lint: test
            args: ""
          - lint: clippy
            args: " --all --all-features -- -D warnings"
          - lint: fmt
            args: " --all -- --check"
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-${{ matrix.lint }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.OS }}-${{ matrix.lint }}-
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy,rustfmt
      - run: cargo ${{ matrix.lint }}${{ matrix.args }}
